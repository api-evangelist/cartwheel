aid: cartwheel
name: Cartwheel
description: >-
  Cartwheel is a generative motion platform for games, film & TV, advertising, and robotics.
  It gives creators a new way to animate 3D characters — turning ordinary video into clean,
  usable character motion (video-to-motion), and posing and rendering characters as images in
  any visual style. Cartwheel is delivered as a hosted web studio (studio.getcartwheel.com)
  with exportable animation formats for downstream 3D, game, film, and social pipelines. The
  product is in private beta and is backed by Accel, Craft Ventures, and Menlo Ventures. At
  this time Cartwheel exposes no public developer/REST API; this profile captures its public
  web, documentation, and security surface.
